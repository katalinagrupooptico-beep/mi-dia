<html lang="es">
<head>

<style>
/* VOICE: calma de vendedora organizada; directo, cálido, nada de ruido.
   IDEA: la hoja de ruta del día que lleva en la bandeja: lo que toca hoy, tildado a mano.
   PICTURE: la lista del día con su anillo de avance; es la herramienta misma.
   COLOUR and TYPE: gris cálido claro, tinta grafito, azulcito Grupo Óptico, coral solo para lo vencido. Outfit + Inter.
   LAYOUT: una columna de 640px, barra inferior de 4 pestañas, hojas que suben desde abajo. */
:root{color-scheme:light dark;--bg:light-dark(#f3f1ed,#16171a);--card:light-dark(#fffdfa,#212226);--ink:light-dark(#1d1f24,#ecebe8);--mut:light-dark(#6c6a66,#a09e99);--line:light-dark(#e3dfd8,#33343a);--az:light-dark(#2f7fc4,#6cb0ea);--azs:light-dark(#e4f0fa,#1d2e3d);--co:light-dark(#d4552f,#f08a68);--cos:light-dark(#fbe9e2,#3a241d);--ok:light-dark(#3f8a5a,#79c495)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip;padding-bottom:84px}
h1,h2,h3{font-family:Outfit,Inter,sans-serif;font-weight:600;margin:0;line-height:1.1;text-wrap:balance}
h1{font-size:32px}h2{font-size:20px}h3{font-size:17px}
main{max-width:640px;margin:0 auto;padding:20px 16px}
.top{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.top .d{flex:1}.top small{color:var(--mut);font-size:14px;display:block;margin-bottom:4px}
.ring{width:72px;height:72px;flex:none}
.sec{margin:22px 0 8px;display:flex;align-items:baseline;gap:8px}.sec span{color:var(--mut);font-size:14px}
.it{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:12px;align-items:flex-start;margin-bottom:8px}
.it.venc{border-color:var(--co);background:linear-gradient(var(--cos),var(--cos)) left/4px 100% no-repeat,var(--card)}
.it.done{opacity:.55}.it.done .tt{text-decoration:line-through}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--az);background:none;flex:none;cursor:pointer;margin-top:2px;padding:0;display:grid;place-items:center;color:#fff}
.done .chk{background:var(--az)}
.bd{flex:1}.tt{font-weight:600}.sub{color:var(--mut);font-size:14px;margin-top:2px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.b{font:500 14px Inter,sans-serif;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;min-height:38px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.b.p{background:var(--az);border-color:var(--az);color:#fff}.b.w{color:var(--ok);border-color:var(--ok)}
.b:focus-visible,.chk:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--az);outline-offset:2px}
.tag{font-size:12px;border-radius:6px;padding:2px 7px;background:var(--azs);color:var(--az);white-space:nowrap}
.tag.c{background:var(--cos);color:var(--co)}
.empty{color:var(--mut);text-align:center;padding:24px 8px;border:1px dashed var(--line);border-radius:14px}
input,select,textarea{font:16px Inter,sans-serif;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
textarea{min-height:80px}label{font-size:14px;color:var(--mut);display:block;margin:12px 0 4px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 140px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0;scrollbar-width:none}.chips .b{flex:none}.chips .b.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
nav{position:fixed;inset:auto 0 0 0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav a{flex:1;max-width:160px;text-align:center;padding:10px 4px 12px;color:var(--mut);text-decoration:none;font-size:13px;font-weight:500}
nav a svg{display:block;margin:0 auto 3px;width:22px;height:22px}
nav a.on{color:var(--az)}
.plus{flex:none;width:56px;height:56px;margin:-18px 6px 0;border-radius:50%;border:0;background:var(--az);color:#fff;font:500 30px/1 Outfit,sans-serif;cursor:pointer;box-shadow:0 4px 14px rgb(47 127 196/.35)}
.alarm{border-color:var(--co)}.alarm h2{color:var(--co)}
.msg{min-height:170px}
.colab nav a:not([data-v=cobros]),.colab .plus{display:none}
.badge{background:var(--co);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;margin-left:3px}
.sheet{position:fixed;inset:0;background:rgb(0 0 0/.35);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet.on{display:flex}
.pan{background:var(--bg);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 16px 28px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}@media(prefers-reduced-motion:reduce){.pan{animation:none}}
.pan .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.x{background:none;border:0;font-size:26px;color:var(--mut);cursor:pointer;min-width:44px;min-height:44px}
.note{border-left:2px solid var(--line);padding:2px 0 2px 10px;margin:8px 0;font-size:14px}.note b{color:var(--mut);font-weight:500}
.kpi{display:flex;gap:10px;margin:10px 0}.kpi div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi b{font:600 clamp(17px,5.2vw,24px) Outfit,sans-serif;display:block;white-space:nowrap}.kpi span{font-size:13px;color:var(--mut)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;display:none;z-index:20}
.warn{background:var(--cos);color:var(--co);padding:10px 12px;border-radius:10px;font-size:14px;margin-bottom:10px;display:none}
.sel{display:flex;align-items:center;gap:10px}.sel input{width:22px;height:22px;flex:none}
details summary{cursor:pointer;color:var(--mut);font-size:14px;padding:8px 0}
</style>
</head>
<body>

  <a href="#cobros" data-v="cobros"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6.5 9.5v5M17.5 9.5v5"/></svg>Ventas</a>
</nav>
<div class="sheet" id="sheet"><div class="pan" id="pan"></div></div>
<div class="toast" id="toast"></div>
<script>window.addEventListener("error",function(e){try{var w=document.getElementById("warn");if(!w)return;w.style.display="block";var out="Error: "+(e.message||e);if(/Invalid or unexpected/.test(String(e.message))){var sc=document.scripts,t="";for(var q=0;q<sc.length;q++){if(sc[q].text.length>t.length)t=sc[q].text}var L=t.split("\n");for(var k=1;k<=L.length;k++){try{new Function(L.slice(0,k).join("\n"))}catch(er){if(/Invalid or unexpected/.test(er.message)){var x=L[k-1];out+=" | linea "+k+": "+x.slice(0,300)+" | codes: "+x.split("").filter(function(c){return c.charCodeAt(0)>126||c.charCodeAt(0)<32}).map(function(c){return c.charCodeAt(0).toString(16)}).join(",");break}}}}w.textContent=out}catch(_){}});</script>

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
})();</script>
<script>
{
const TZ='America/Argentina/Cordoba';
const iso=d=>d.toLocaleDateString('en-CA',{timeZone:TZ});
const HOY=iso(new Date());
const addD=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const fmt=s=>s?new Date(s+'T12:00:00').toLocaleDateString('es-AR',{weekday:'short',day:'numeric',month:'short'}):'';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Number(n||0).toLocaleString('es-AR');
const $=id=>document.getElementById(id);
const ETAPAS={cliente:'Cliente',dormido:'Dormido',prospecto:'Prospecto',descartado:'Descartado'};
const MES=HOY.slice(0,7),INIMES=MES+'-01';
const delMes=c=>c.proxMes&&c.proxMes<=MES&&c.etapa!=='descartado'&&!(c.ultimo&&c.ultimo>=INIMES)&&!(c.prox&&c.prox>HOY);
const TIPOS={seg:'Seguimiento',cobro:'Cobranza',visita:'Visita',estado:'Estado / difusión',otro:'Otra'};
let giras={},base=[],ov={},tareas={},cobros={},pedidos={},difus={},esDueña=true,assets=null,db=null,canWrite=true,sample=null,alarmShown=false,baseOK=false,dbOK=false;
const LINKS=[['Mi Linktree','https:\/\/linktr.ee/armazonesgrupooptico'],['Lista de precios','https:\/\/drive.google.com/file/d/1wbP8kpGzR3mswYuYrV2bN4XsEeVokuoj/view?usp=drive_link'],['Formas de pago','https:\/\/drive.google.com/file/d/1GMYTjHOvtyawt1dFBzl0HoG0jvGs9okl/view?usp=drive_link'],['Catálogo LGI','https:\/\/app.lgisrl.com.ar'],['Catálogo Bend Flex','https:\/\/drive.google.com/drive/folders/1awgYYzpk7rdZqMFrJfuONfhy3ukg9yHj']];
const LT=LINKS[0][1];
const sinSig=t=>String(t==null?'':t).replace(/[¿¡]/g,'');
const BLOQUES=[['Financiación','Hay financiación en cheques hasta 150 días o financiaciones disponibles que se adapten a vos.'],['Promo Embó','Sigue la promo EMBÓ hasta el 31/03/2027, preguntame cómo aprovecharla.'],['15% Bend','Comprando LGI tenés 15% de descuento en Bend Flex.'],['Paso con la valija','Si querés paso esta semana con la valija y te muestro todo.']];
const misLinks=()=>((difus['cfg-links']||{}).links||[]).filter(x=>x&&x[0]&&x[1]);
const allLinks=()=>LINKS.concat(misLinks());
const FRASE_LINK={'Mi Linktree':'Además te dejo el link que contiene el QR que está en mi tarjeta de contacto, ahí tenés toda la info:','Lista de precios':'Te dejo acceso rápido a la lista de precios:','Formas de pago':'Te dejo las formas de pago:','Catálogo LGI':'Acá podés ver el catálogo de LGI con todos los modelos:','Catálogo Bend Flex':'Y acá el catálogo de Bend Flex:'};
const fraseLink=(n,u)=>(FRASE_LINK[n]||('Te dejo '+n.charAt(0).toLowerCase()+n.slice(1)+':'))+' '+u;
const MOTIVOS={faltantes:'Faltantes / monto final',seguimiento:'Seguimiento',pedido:'Pedido despachado',postventa:'Cómo llegó',mes1:'Pasó un mes',mes2:'Pasaron dos meses',gira:'Aviso de gira',reposicion:'Reposición',reactivar:'Reactivar',cobro:'Cobro',novedades:'Novedades',embo:'Promo Embó',postvisita:'Post visita',primera:'Primera presentación',otro:'Otro'};
const telWa=t=>{let d=String(t||'').replace(/\D/g,'');if(d.startsWith('54'))d=d.slice(2);if(d.startsWith('9')&&d.length===11)d=d.slice(1);d=d.replace(/^0/,'');if(d.length===12){for(const p of [3,4,2])if(d.substr(p,2)==='15'){d=d.slice(0,p)+d.slice(p+2);break}}if(d.length===9&&d.startsWith('15'))d=d.slice(2);if(d.length===7)d='351'+d;return d.length===10?'549'+d:''};
function plantilla(m,c,p){const nom='';switch(m){
 case 'seguimiento':{const n=(c.notas||[]).length;return n<=1?`Hola! ¿Cómo andás? Soy Katalina de Grupo Óptico, te visité hace unos días. ¿Pudiste mirar la lista de precios y los catálogos? Si querés te paso fotos de los modelos que más se están moviendo.`:n===2?`Hola! ¿Cómo va todo? Te escribo para no perder el contacto: entraron novedades de Tiffany Occhiali y Union Pacific, y hay financiación en cheques para compras desde 100 piezas LGI. ¿Te parece que pase un día de estos con la valija?`:`Hola! ¿Cómo estás? Paso a saludar y a contarte que sigo con las novedades de Grupo Óptico. Cuando quieras te muestro la valija o te mando lo nuevo por acá.`}
 case 'pedido':{const v=(pedidos[(st.vctx||'')]||{});return `Hola! ¿Cómo andás? Te cuento que tu pedido ya salió${v.entregaEst?' y llegaría aproximadamente el '+fmt(v.entregaEst):''}. ${v.notaCliente?v.notaCliente+' ':''}${v.comprobante?'Te paso el comprobante. ':''}Cualquier cosa me avisás. ¡Gracias por la compra!`}
 case 'faltantes':{const v=(pedidos[(st.vctx||'')]||{});return `Hola! ¿Cómo andás? Te cuento sobre tu pedido del ${v.f?new Date(v.f+'T12:00:00').toLocaleDateString('es-AR',{day:'numeric',month:'numeric'}):''}: ${v.faltantes?'no llegaron a entrar '+v.faltantes+', ':'hubo un ajuste, '}así que el monto final queda en ${money(montoFinal(v))}${v.monto&&montoFinal(v)!==Number(v.monto)?' (en vez de '+money(v.monto)+')':''}. Cuando ingresen te aviso. ¡Gracias!`}
 case 'postventa':return `Hola! ¿Cómo andás? ¿Llegó bien el pedido? ¿Qué te parecieron los modelos? Si necesitás algo más o algún cambio, avisame.`;
 case 'mes1':return `Hola! ¿Cómo va? Ya pasó un mes del pedido, ¿cómo se están moviendo los modelos? ¿Hay alguno que se haya vendido rápido y quieras reponer?`;
 case 'mes2':return `Hola! ¿Cómo andás? Pasaron dos meses del último pedido. ¿Cómo vienen las ventas? Te puedo armar una reposición con lo que más salió y sumar algunas novedades.`;
 case 'gira':{const g=(st.gctx||{})[c.id]||{};return `Hola! ¿Cómo andás? ${g.fecha?'El '+new Date(g.fecha+'T12:00:00').toLocaleDateString('es-AR',{weekday:'long',day:'numeric'}):'Estos días'} voy a estar por ${g.loc||c.barrio||'tu zona'}${st.g&&st.g.mati?' con Mati, mi compañero del laboratorio,':''} con las novedades de Tiffany Occhiali, Union Pacific, Paul Riviere, Embó y Bend Flex. ¿Te puedo pasar a ver? ¿Qué horario te queda cómodo?`}
 case 'reposicion':return `Hola! ¿Cómo andás? Te escribo de Grupo Óptico. ${c.ultCompra?'Ya pasaron unos meses de tu última compra y ':''}entraron modelos nuevos de Tiffany Occhiali, Union Pacific y Paul Riviere. Querés que te pase fotos o coordinamos una cita para que vean y conozcan la valija?`;
 case 'reactivar':return `Hola! Cómo va? Hace un tiempo que no hablamos y tenemos muchas novedades en armazones. Además la financiación en cheques hasta 150 días o financiaciones disponibles que se adapten a vos.`;
 case 'cobro':return `Hola! ¿Cómo andás? Te escribo por el saldo pendiente${p&&p.monto?' de '+money(p.monto):''}${p&&p.fecha?' ('+(p.tipo==='Factura'?'factura ':'')+'del '+fmt(p.fecha)+')':''}. ¿Me confirmás cuándo lo podemos coordinar? ¡Gracias!`;
 case 'novedades':return `Hola! ¿Cómo estás? Llegaron modelos nuevos y me acordé de ustedes. ¿Te mando fotos o paso esta semana con la valija?`;
 case 'embo':return `Hola! Te escribo por la promo EMBÓ de este mes. ¿Cómo vienen con los modelos? Si querés reponer, avisame y lo armamos.`;
 case 'postvisita':return `Hola! Soy Katalina de Grupo Óptico, acabo de visitarte. Gracias por recibirme! Agendame así te paso las novedades de Tiffany Occhiali, Union Pacific, Paul Riviere, Embó y Bend Flex. Acá tenés toda la info que también te deje en la tarjeta de contacto (lista de precios, formas de pago y catálogos): ${LT}`;
 case 'primera':return `Hola! ¿Cómo estás? Soy Katalina, de Grupo Óptico. ${c.origen==='Laboratorio'?'Ya trabajan con nuestro laboratorio y ahora también les puedo ofrecer armazones: ':'Distribuimos en Córdoba las marcas '}Tiffany Occhiali, Union Pacific, Paul Riviere, Embó y Bend Flex. Me encantaría pasar a mostrarles la valija. Te dejo toda la info: ${LT}`;
 default:return 'Hola! ¿Cómo andás? Te escribo de Grupo Óptico. ';}}
const motivoDe=(c,tipo)=>tipo==='cobro'?'cobro':c.etapa==='prospecto'&&(c.notas||[]).length?'seguimiento':/repos/i.test(c.accion||'')?'reposicion':/reactiv|recuper/i.test(c.accion||'')?'reactivar':c.etapa==='prospecto'?'primera':'novedades';
let st={vt:'pedidos',inf:null,g:{dias:1,ida:'',porDia:8,mati:false,zona:'',locs:[],plan:null},gctx:{},nv:{imgs:[],marca:'Tiffany Occhiali',titulo:'Nuevos ingresos',cierre:'go',src:'catalogo',fm:'',fc:'',solo:true,sel:new Set(),rec:true},cq:'',ce:'mes',cz:'',cb:'',rb:'',rsel:new Set(),cobF:'pendiente',cobT:''};
const TIPOL=t=>t==='Remito'?'En 02':t==='Factura'?'Facturado':(t||'');

const cli=id=>{const b=base.find(c=>c.id===id)||{};return Object.assign({},b,ov[id]||{},{id})};
const allCli=()=>{const ids=new Set(base.map(c=>c.id));Object.keys(ov).forEach(k=>ids.add(k));return [...ids].map(cli).filter(c=>c.n)};
const waLink=(c,msg)=>c.wa?'https:\/\/wa.me/'+encodeURIComponent(c.wa)+'?text='+encodeURIComponent(sinSig(msg||'')):'';
const mapLink=c=>'https:\/\/www.google.com/maps/search/?api=1&query='+encodeURIComponent([c.dir,c.barrio,'Córdoba'].filter(Boolean).join(', '));
const toast=t=>{const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2200)};
const warn=t=>{const e=$('warn');e.textContent=t||'';e.style.display=t?'block':'none'};

async function save(path,data){
  if(!db){warn('No me puedo conectar con la base: los cambios no se guardan.');return false}
  try{await db.doc(path).set(data);return true}
  catch(e){if(e&&e.code==='invalid_argument'){canWrite=false}warn('No se pudo guardar ('+(e&&e.code||'error')+').');return false}
}
async function del(path){if(db)try{await db.doc(path).delete()}catch(e){warn('No se pudo borrar.')}}
const saveCli=(id,patch)=>{const o=Object.assign({},ov[id]||{},patch);ov[id]=o;render();return save('clientes/'+id,o)};
const newId=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

 
function manana(sec){
  const d=nextHabil(addD(HOY,1)),vis=sec==='vis';
  const T=Object.entries(tareas).filter(([,t])=>!t.hecha&&t.f>HOY&&t.f<=d&&((t.tipo==='visita')===vis));
  const C=vis?[]:allCli().filter(c=>c.prox&&c.prox>HOY&&c.prox<=d&&c.etapa!=='descartado');
  const P=vis?[]:Object.entries(cobros).filter(([,p])=>p.estado==='pendiente'&&!p.noReclamar&&p.vence&&p.vence>HOY&&p.vence<=d);

function b64De(p,d){d=d||0;if(d>6||p==null)return null;

  if(Array.isArray(p)){for(const x of p){const r=b64De(x,d+1);if(r)return r}return null}
  if(typeof p==='object'){const mt=p.mimeType||p.contentMimeType||'image/png';for(const k of ['data','blob','base64Content','content','bytes']){const v=p[k];if(typeof v==='string'&&v.length>200&&!v.startsWith('data:')&&/^[A-Za-z0-9+/=\s]+$/.test(v.slice(0,400)))return 'data:'+mt+';base64,'+v.replace(/\s/g,'')}for(const k in p){const r=b64De(p[k],d+1);if(r)return r}}

async function saldoHoja(p,n,g){

    const txt='Kata '+fh+': '+(g.r==='pago'?'pagó todo'+(g.monto?' ('+money(g.monto)+')':''):g.r==='parcial'?'pagó '+money(g.monto||0):RESP[g.r]+(g.fp?' para el '+fmt(g.fp):''))+(g.nota?' · '+g.nota:'');
    const obs=obs0?obs0+' | '+txt:txt;
    if(g.r==='pago')await gs('update_values',{range:tab+'!E'+fila+':F'+fila,values:[['SI',obs]]});
    else if(g.r==='parcial')await gs('update_values',{range:tab+'!D'+fila+':F'+fila,values:[[Number(n.monto||0),'PARCIAL',obs]]});
    else await gs('update_values',{range:tab+'!F'+fila,values:[[obs]]});

  }catch(e){toast('No pude anotarlo en la hoja de trabajo')}
}

  const on=(col,setter)=>db.collection(col).onSnapshot(s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data());setter(o);if(!s.metadata.fromCache&&++loaded>=NEED){clearTimeout(tm);warn('');dbOK=true}render();alarma()},err=>{clearTimeout(tm);if(err.code!=='clave')warn('No pude leer la planilla ('+err.code+'). Probá Actualizar.')});
  on('pseg',o=>{pseg=o;for(const k in pedidos){const sg=(o[k]||{}).seg;if(sg)pedidos[k]=Object.assign({},pedidos[k],{seg:sg})}});on('smartlab',o=>slab=o);on('viaticos',o=>{for(const k in o)if(!vSync[k])viat[k]=o[k]});on('clientes',o=>ov=o);on('tareas',o=>tareas=o);on('cobros',o=>cobros=o);on('difusiones',o=>difus=o);on('giras',o=>giras=o);
  if(baseOK)cargarPedidos();
  setInterval(()=>{if(document.visibilityState==='visible')cargarPedidos()},180000);
}
if(GAS&&!CLAVE)pedirClave();else boot();
}
